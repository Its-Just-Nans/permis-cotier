id: barre-route-0008
option: cotier
theme: barre-route
notion: barre-routes-opposees
statut: publie
difficulte: 2
enonce: >-
  Tu fais route de nuit au moteur et tu vois devant toi un navire dont les deux feux de
  mât sont l'un par l'autre et dont les deux feux de côté sont visibles. Quelle situation
  as-tu sous les yeux ?
propositions:
  - id: a
    texte: Une situation de navires qui se rattrapent.
  - id: b
    texte: Une situation de routes directement opposées.
  - id: c
    texte: Une situation de routes qui se croisent.
reponses:
  - b
explication: >-
  De nuit, voir les feux de mât de l'autre navire l'un par l'autre ou presque, et ses deux
  feux de côté, veut dire qu'il est devant toi ou presque : vous faites des routes
  directement opposées. Le texte dit « et/ou » : un seul de ces deux indices suffit déjà à
  le craindre. Un seul feu de côté avec des feux de mât nettement décalés signerait plutôt
  une route qui croise.
sources:
  - texte: RIPAM, règle 14 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-14'
