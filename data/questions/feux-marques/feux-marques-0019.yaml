id: feux-marques-0019
option: cotier
theme: feux-marques
notion: feux-voile-aviron
statut: publie
difficulte: 2
enonce: >-
  Ton voilier mesure 16 mètres et fait route à la voile : que te permet la règle pour
  les feux de côté et le feu de poupe ?
propositions:
  - id: a
    texte: Les réunir en un seul fanal placé au sommet ou à la partie supérieure du mât,
      à l'endroit le plus visible.
  - id: b
    texte: Réunir les trois feux en un seul fanal placé à l'avant, sur l'étrave.
reponses:
  - a
explication: >-
  Un navire à voile de moins de 20 mètres peut réunir ses feux de côté et son feu de poupe
  en un seul fanal, au sommet ou à la partie supérieure du mât, jamais à l'avant. Ton bateau
  de 16 mètres entre dans cette limite. Attention : la limite est 20 mètres, pas 12.
sources:
  - texte: RIPAM, règle 25 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-14'
